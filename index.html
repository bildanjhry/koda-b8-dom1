<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Celsius to Fahrenheit</h1>
    <form action="" id="form">
        <label for="calc">Input celsius value</label>
        <br>
        <input type="number" name="calc" id="calc" value="">
        <button type="submit">
            Convert
        </button>
    </form>

    <p>Result: <span class="result"></span></p>

    <script type="text/javascript">
        function calc(val){
            return (val * 9/5) + 32
        }

        document.getElementById("form").addEventListener('submit', function(event){
            event.preventDefault()
            const form = new FormData(event.target)
            const value = form.get('calc')
            document.querySelector(".result").textContent = `${calc(parseInt(value)).toString()}F`
        })

    </script>
</body>
</html>
